name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel intermediate builds only on pull requests.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  quality:
    name: Aqua and JET / Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: write   # lets julia-actions/cache delete its old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        shell: julia --project=test/code-quality --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Run Aqua and JET
        run: julia --project=test/code-quality --color=yes test/code-quality/runtests.jl
