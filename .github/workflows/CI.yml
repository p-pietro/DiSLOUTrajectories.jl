name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel intermediate builds only on pull requests.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write   # lets julia-actions/cache delete its old caches
      contents: read
      id-token: write  # Codecov upload through OIDC
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 4
          JUNIT_OUTPUT: ${{ github.workspace }}/junit.xml
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: junit.xml
          flags: julia-${{ matrix.version }}-${{ runner.os }}
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
